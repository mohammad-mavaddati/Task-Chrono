<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Chrono Pro | نسخه بهبود یافته</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        primary: '#8b5cf6', // Violet
                        secondary: '#10b981', // Emerald
                        accent: '#f43f5e', // Rose
                        dark: '#020617', 
                        surface: '#0f172a',
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(139, 92, 246, 0.5)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideOut: {
                            to: { opacity: '0', transform: 'translateX(50px)', height: '0', padding: '0', margin: '0' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Vazirmatn', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Modern Glass */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }

        /* --- Improved Audio Range Slider (RTL FIXED) --- */
        .audio-range {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        
        /* Progress Fill Visualization using CSS Var (Starts from RIGHT) */
        /* Since the range input is now native RTL, it moves knob from R->L.
           This custom fill will also start from R and fill L as the knob moves. */
        .audio-range::before {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: var(--progress, 0%);
            background: #8b5cf6;
            border-radius: 99px;
            pointer-events: none;
        }

        /* Track (Needed for compatibility) */
        .audio-range::-webkit-slider-runnable-track {
            background: transparent;
            height: 6px;
            border-radius: 99px;
        }

        /* Thumb (Knob) */
        .audio-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
            border: 2px solid #8b5cf6;
            transition: transform 0.1s;
            position: relative;
            z-index: 20;
            margin-top: -4px; /* Fix alignment */
        }
        .audio-range::-webkit-slider-thumb:active { transform: scale(1.3); }
        /* Removed: .audio-range { direction: ltr; } to allow native RTL knob movement */


        /* --- Improved Circular Video Player --- */
        .circular-player-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 50%;
            z-index: 1;
        }
        
        .circular-player-wrapper.active {
            width: 280px;
            height: 280px;
            z-index: 50;
        }
        
        .video-mask {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 4px solid #1e293b;
            background: #000;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8);
            transition: border-color 0.3s;
        }
        .circular-player-wrapper.active .video-mask { border-color: #000; }

        .circular-video { width: 100%; height: 100%; object-fit: cover; }

        .progress-ring-svg {
            position: absolute; top: -15px; left: -15px;
            width: calc(100% + 30px); height: calc(100% + 30px);
            pointer-events: none; transform: rotate(-90deg); z-index: 10;
            opacity: 0; transition: opacity 0.3s;
        }
        .circular-player-wrapper.active .progress-ring-svg { opacity: 1; }

        .progress-ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 4; }
        .progress-ring-fill {
            fill: none; stroke: #f43f5e; stroke-width: 4;
            stroke-linecap: round; stroke-dasharray: 0 1000;
            filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.6));
        }

        .control-knob {
            position: absolute; width: 24px; height: 24px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
            z-index: 20; opacity: 0; pointer-events: none;
            /* Center the knob perfectly on its coordinate */
            transform: translate(-55%, -55%); 
            border: 4px solid #f43f5e;
            transition: opacity 0.3s;
        }
        .circular-player-wrapper.active .control-knob { opacity: 1; }

        .interaction-layer {
            position: absolute; inset: -20px;
            border-radius: 50%; z-index: 15; cursor: pointer;
        }

        .play-overlay {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); border-radius: 50%;
            pointer-events: none; transition: all 0.3s;
            backdrop-filter: blur(2px);
        }
        .circular-player-wrapper.playing .play-overlay { opacity: 0; transform: scale(1.1); }
        .circular-player-wrapper.active:not(.playing) .play-overlay { background: rgba(0,0,0,0.6); }

        /* Recording Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .recording-pulse { animation: pulse-ring 2s infinite; }
        
        .mode-btn-active {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-32 antialiased selection:bg-primary/30">

    <div id="toast" class="fixed top-8 left-1/2 transform -translate-x-1/2 z-[100] flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none border border-white/10 backdrop-blur-xl">
        <i id="toastIcon" class="ph-bold ph-check-circle text-2xl text-emerald-400"></i>
        <span id="toastMessage" class="font-bold text-sm"></span>
    </div>

        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-primary to-indigo-600 flex items-center justify-center text-white shadow-neon ring-1 ring-white/10">
                <i class="ph-bold ph-hourglass-high text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">Task Chrono</h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Pro Edition</p>
            </div>
        </div>
        <div class="flex gap-2">
            <input type="file" id="importInput" accept=".zip" class="hidden">
            <button onclick="document.getElementById('importInput').click()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center group border border-white/5" title="بازیابی">
                <i class="ph-bold ph-download-simple text-xl group-hover:text-white"></i>
            </button>
            <button onclick="app.exportData()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center justify-center group border border-white/5" title="پشتیبان‌گیری">
                <i class="ph-bold ph-upload-simple text-xl group-hover:text-white"></i>

    </header>

    <main class="container mx-auto px-4 max-w-lg">

        <div class="glass-panel rounded-[2.5rem] p-2 mb-8 shadow-2xl relative overflow-hidden transition-all duration-500 ring-1 ring-white/5">
            
            <div class="flex bg-slate-950/60 rounded-[2rem] p-1.5 mb-5 backdrop-blur-md relative z-20">
                <button onclick="app.setMode('text')" id="modeBtnText" class="flex-1 py-4 rounded-[1.7rem] text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400">
                    <i class="ph-bold ph-text-t text-lg"></i> متنی

                <button onclick="app.setMode('audio')" id="modeBtnAudio" class="flex-1 py-4 rounded-[1.7rem] text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400">
                    <i class="ph-bold ph-microphone text-lg"></i> صوتی
                </button>
                <button onclick="app.setMode('video')" id="modeBtnVideo" class="flex-1 py-4 rounded-[1.7rem] text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400">
                    <i class="ph-bold ph-video-camera text-lg"></i> ویدیو
                </button>
            </div>

            <div class="px-5 pb-5">
                <div class="space-y-6 mb-8">
                    <div class="relative">
                        <input type="text" id="inputTitle" placeholder=" " class="peer w-full bg-transparent border-b border-slate-700 focus:border-primary outline-none py-3 pt-5 text-lg font-bold text-white transition-colors">
                        <label class="absolute right-0 top-3 text-slate-500 text-sm transition-all peer-focus:text-xs peer-focus:top-0 peer-focus:text-primary pointer-events-none peer-placeholder-shown:top-3 peer-placeholder-shown:text-base">عنوان فعالیت</label>
                    </div>
                    
                    <div class="relative group">
                        <select id="inputCategory" class="w-full bg-slate-800/40 text-slate-300 text-sm font-medium rounded-2xl p-4 outline-none focus:ring-2 focus:ring-primary/50 appearance-none cursor-pointer border border-white/5 transition-all hover:bg-slate-800/60">
                            <option value="work">💼 کار و پروژه</option>
                            <option value="study">📚 یادگیری و مطالعه</option>
                            <option value="health">💪 ورزش و سلامت</option>
                            <option value="idea">💡 ایده‌پردازی</option>
                            <option value="life">🏠 امور شخصی</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute left-4 top-4.5 text-slate-400 pointer-events-none group-hover:text-white transition"></i>
                    </div>
                </div>

                <div id="modeContentContainer" class="relative overflow-hidden transition-all duration-500">
                    <div id="modeText" class="mode-content absolute w-full top-0 left-0 transition-opacity duration-300 opacity-100 z-10">
                        <textarea id="inputDesc" placeholder="توضیحات تکمیلی..." class="w-full bg-slate-900/40 rounded-3xl p-5 text-sm text-slate-300 outline-none focus:ring-2 focus:ring-primary/50 min-h-[140px] resize-none border border-white/5 placeholder-slate-600"></textarea>
                    </div>

                    <div id="modeAudio" class="mode-content absolute w-full top-0 left-0 transition-opacity duration-300 opacity-0 pointer-events-none z-0">
                        <div class="flex flex-col items-center justify-center py-6 bg-slate-900/30 rounded-3xl border border-dashed border-slate-700/50">
                            <div id="audioRecorderState" class="w-full flex flex-col items-center">
                                <canvas id="audioVisualizer" width="300" height="80" class="w-full h-[80px] mb-6 opacity-80 px-4"></canvas>
                                <div id="audioTimer" class="text-5xl font-mono text-white font-bold mb-10 tracking-widest drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">00:00</div>
                                <div class="flex items-center gap-8">
                                    <button id="btnRecordAudio" class="w-24 h-24 rounded-full bg-gradient-to-tr from-rose-500 to-pink-600 shadow-[0_0_30px_rgba(244,63,94,0.4)] flex items-center justify-center transition-transform active:scale-90 border-[6px] border-slate-900 ring-2 ring-rose-500/50 hover:scale-105">
                                        <i class="ph-fill ph-microphone text-4xl text-white"></i>
                                    </button>
                                    <button id="btnStopAudio" class="hidden w-24 h-24 rounded-full bg-slate-900 border-4 border-rose-500 flex items-center justify-center recording-pulse active:scale-95">
                                        <div class="w-10 h-10 bg-rose-500 rounded-lg shadow-[0_0_20px_rgba(244,63,94,0.8)]"></div>
                                    </button>
                                </div>
                            </div>
                            <div id="audioReviewState" class="w-full px-4 hidden animate-slide-up">
                                <div class="bg-slate-800/60 rounded-2xl p-6 flex flex-col gap-4 border border-white/5 text-center">
                                    <h3 class="text-white font-bold mb-4">بازبینی صدا</h3>
                                    
                                    <div id="audioReviewPlayer" class="w-full"></div>
                                    
                                    <button onclick="app.resetAudio()" class="text-xs text-rose-400 hover:text-rose-300 flex items-center justify-center gap-1.5 py-2 hover:bg-rose-500/10 rounded-lg transition"><i class="ph-bold ph-trash"></i> حذف و ضبط مجدد</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="modeVideo" class="mode-content absolute w-full top-0 left-0 transition-opacity duration-300 opacity-0 pointer-events-none z-0">
                        <div class="flex flex-col items-center justify-center py-4 bg-slate-900/30 rounded-3xl border border-dashed border-slate-700/50">
                            <div class="relative w-[280px] h-[280px] bg-black rounded-full overflow-hidden mb-8 border-[8px] border-slate-800 shadow-2xl ring-1 ring-white/10">
                                <video id="videoPreview" autoplay muted playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                                <video id="videoReview" playsinline class="w-full h-full object-cover hidden"></video>
                                <div id="videoTimerOverlay" class="absolute bottom-10 left-0 right-0 text-center pointer-events-none">
                                    <span id="videoTimer" class="bg-rose-500/90 px-5 py-2 rounded-full text-base font-mono font-bold text-white backdrop-blur-md shadow-lg">00:00</span>
                                </div>
                            </div>
                            <div id="videoControls" class="flex items-center gap-6">
                                <button id="btnRecordVideo" class="w-24 h-24 rounded-full bg-gradient-to-tr from-rose-500 to-orange-500 shadow-[0_0_30px_rgba(244,63,94,0.4)] flex items-center justify-center transition-transform active:scale-90 border-[6px] border-slate-900 ring-2 ring-rose-500/50 hover:scale-105">
                                    <i class="ph-fill ph-video-camera text-4xl text-white"></i>
                                </button>
                                <button id="btnStopVideo" class="hidden w-24 h-24 rounded-full bg-slate-900 border-4 border-rose-500 flex items-center justify-center recording-pulse active:scale-95">
                                    <div class="w-10 h-10 bg-rose-500 rounded-lg shadow-[0_0_20px_rgba(244,63,94,0.8)]"></div>
                                </button>
                                <div id="videoReviewActions" class="hidden flex gap-8 animate-slide-up">
                                    <button onclick="app.resetVideo()" class="w-16 h-16 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center hover:bg-slate-700 transition border border-white/10"><i class="ph-bold ph-trash text-2xl"></i></button>
                                    <button id="btnPlayVideoPreview" class="w-20 h-20 rounded-full bg-gradient-to-r from-primary to-indigo-600 text-white flex items-center justify-center shadow-neon hover:scale-105 transition"><i class="ph-fill ph-play text-3xl ml-1"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-slate-700/50">
                    <button id="submitBtn" onclick="app.submitLog()" class="w-full bg-gradient-to-r from-primary to-indigo-600 hover:shadow-neon text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-3 group relative overflow-hidden">
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 rounded-2xl"></div>
                        <span id="submitBtnText" class="relative z-10">ثبت فعالیت</span>
                        <i id="submitBtnIcon" class="ph-bold ph-arrow-left text-xl group-hover:-translate-x-1 transition-transform relative z-10"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 mb-6 px-4">
            <div class="relative flex-1 group">
                <i class="ph-bold ph-magnifying-glass absolute right-4 top-3.5 text-slate-500 group-focus-within:text-primary transition-colors text-lg"></i>
                <input type="text" id="searchInput" placeholder="جستجو..." class="w-full bg-slate-900/60 rounded-2xl py-3 pr-12 pl-4 text-slate-200 outline-none focus:ring-1 focus:ring-primary/50 transition-all font-medium border border-white/5 focus:bg-slate-900 shadow-sm">
            </div>
        </div>

        <div id="logsContainer" class="space-y-6 pb-20 min-h-[200px]"></div>

    </main>

    <audio id="globalAudioPlayer"></audio>

    <script>
        // --- 1. DB Layer (Same as before) ---
        const DB_CONFIG = { name: 'TaskChronoDB_V4', version: 1, store: 'mediaFiles' };
        const db = {
            instance: null,
            async open() {
                if (this.instance) return this.instance;
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains(DB_CONFIG.store)) d.createObjectStore(DB_CONFIG.store);
                    };
                    req.onsuccess = (e) => { this.instance = e.target.result; resolve(this.instance); };
                    req.onerror = (e) => { console.error("DB Error", e); reject(e); };
                });
            },
            async saveFile(id, blob) {
                const d = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = d.transaction(DB_CONFIG.store, 'readwrite');
                    tx.objectStore(DB_CONFIG.store).put(blob, id);
                    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
                });
            },
            async getFile(id) {
                try {
                    const d = await this.open();
                    return new Promise(r => {
                        const req = d.transaction(DB_CONFIG.store, 'readonly').objectStore(DB_CONFIG.store).get(id);
                        req.onsuccess = () => r(req.result); req.onerror = () => r(null);
                    });
                } catch { return null; }
            },
            async deleteFile(id) {
                try {
                    const d = await this.open();
                    const tx = d.transaction(DB_CONFIG.store, 'readwrite');
                    tx.objectStore(DB_CONFIG.store).delete(id);
                } catch {}
            }
        };

        // --- 2. App Logic ---
        const app = {
            mode: 'text',
            mediaRecorder: null,
            chunks: [],
            timerInterval: null,
            startTime: 0,
            currentBlob: null,
            currentStream: null,
            visualizerFrame: null,
            
            // Audio Seek State
            audioIsDragging: false,
            activeAudioId: null,

            init() {
                this.renderLogs();
                this.setMode('text');
                
                document.getElementById('searchInput').addEventListener('input', (e) => this.renderLogs(e.target.value));
                document.getElementById('importInput').addEventListener('change', this.handleImport.bind(this));
                
                // Global Audio Listeners
                const p = document.getElementById('globalAudioPlayer');
                p.addEventListener('ended', () => this.resetGlobalAudioUI());
                p.addEventListener('pause', () => {
                   if (!this.audioIsDragging) this.updateAudioBtn(this.activeAudioId, false);
                });
                p.addEventListener('play', () => {
                   this.updateAudioBtn(this.activeAudioId, true);
                });
            },

            setMode(m) {
                this.mode = m;
                this.stopEverything();
                
                ['text', 'audio', 'video'].forEach(mode => {
                    const btn = document.getElementById(`modeBtn${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
                    const isActive = mode === m;
                    // Reset classes
                    btn.className = isActive 
                        ? 'flex-1 py-4 rounded-[1.7rem] text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 mode-btn-active transform -translate-y-1'
                        : 'flex-1 py-4 rounded-[1.7rem] text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800/50';
                });

                const container = document.getElementById('modeContentContainer');
                const target = document.getElementById(`mode${m.charAt(0).toUpperCase() + m.slice(1)}`);
                
                document.querySelectorAll('.mode-content').forEach(el => {
                    if (el === target) {
                        el.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
                        el.classList.add('opacity-100', 'z-10');
                    } else {
                        el.classList.remove('opacity-100', 'z-10');
                        el.classList.add('opacity-0', 'pointer-events-none', 'z-0');
                    }
                });
                setTimeout(() => container.style.height = `${target.offsetHeight}px`, 50);
            },

            stopEverything() {
                this.stopStream();
                this.stopTimer();
                this.resetAudioUI();
                this.resetVideoUI();
                if(this.visualizerFrame) cancelAnimationFrame(this.visualizerFrame);
                document.getElementById('globalAudioPlayer').pause();
            },

            async getStream(type) {
                try {
                    const constraints = type === 'audio' ? { audio: true } : { video: { facingMode: "user", width: 480, height: 480 }, audio: true };
                    return await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    this.showToast('دسترسی به دوربین/میکروفون داده نشد', 'error');
                    return null;
                }
            },

            stopStream() {
                if (this.currentStream) {
                    this.currentStream.getTracks().forEach(t => t.stop());
                    this.currentStream = null;
                }
            },

            startTimer(elId) {
                const el = document.getElementById(elId);
                this.startTime = Date.now();
                el.textContent = '00:00';
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    const s = Math.floor((Date.now() - this.startTime) / 1000);
                    el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
                }, 1000);
            },

            stopTimer() { clearInterval(this.timerInterval); },

            async submitLog() {
                const title = document.getElementById('inputTitle').value.trim();
                const desc = document.getElementById('inputDesc').value.trim();
                
                if (!title) return this.showToast('عنوان فعالیت را وارد کنید', 'error');
                if (this.mode !== 'text' && !this.currentBlob) return this.showToast('فایلی ضبط نشده است', 'error');

                const btn = document.getElementById('submitBtn');
                const btnText = document.getElementById('submitBtnText');
                const originalText = btnText.innerText;
                
                btn.disabled = true;
                btnText.innerText = 'در حال ذخیره‌سازی...';
                
                const blobToSave = this.currentBlob;
                const id = Date.now().toString();
                const log = {
                    id, title, desc, 
                    category: document.getElementById('inputCategory').value,
                    type: this.mode,
                    date: new Date().toLocaleDateString('fa-IR', {month: 'long', day:'numeric', hour:'2-digit', minute:'2-digit'}),
                    hasMedia: !!blobToSave
                };

                const logs = JSON.parse(localStorage.getItem('taskLogs') || '[]');
                logs.unshift(log);
                localStorage.setItem('taskLogs', JSON.stringify(logs));

                if (blobToSave) await db.saveFile(id, blobToSave);
                
                await this.renderLogs(); 
                this.resetForm();
                this.showToast('فعالیت ثبت شد');

                btn.disabled = false;
                btnText.innerText = originalText;
            },

            resetForm() {
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputDesc').value = '';
                this.currentBlob = null;
                this.setMode('text');
            },

            // --- Rendering ---
            async renderLogs(filter = '') {
                const container = document.getElementById('logsContainer');
                const logs = JSON.parse(localStorage.getItem('taskLogs') || '[]');
                const filtered = logs.filter(l => l.title.includes(filter) || (l.desc && l.desc.includes(filter)));

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 animate-slide-up opacity-60"><div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-800 text-slate-600 mb-4"><i class="ph-bold ph-tray text-4xl"></i></div><p class="text-slate-500 font-medium">فعالیتی یافت نشد</p></div>`;
                    return;
                }

                const items = await Promise.all(filtered.map(async (log) => {
                    let mediaHtml = '';
                    if (log.hasMedia) {
                        const blob = await db.getFile(log.id);
                        if (blob) {
                            const url = URL.createObjectURL(blob);
                            if (log.type === 'audio') mediaHtml = this.getAudioHTML(url, log.id);
                            else if (log.type === 'video') mediaHtml = this.getVideoHTML(url, log.id);
                        } else mediaHtml = `<div class="mt-4 p-3 rounded-xl bg-rose-500/10 text-rose-400 text-xs text-center border border-rose-500/20">خطا در بارگذاری مدیا</div>`;
                    }

                    const iconMap = { text: 'ph-text-t', audio: 'ph-microphone', video: 'ph-video-camera' };
                    const colorMap = { text: 'from-blue-500 to-cyan-500', audio: 'from-violet-500 to-purple-500', video: 'from-rose-500 to-orange-500' };
                    const catMap = { work:'کار', study:'مطالعه', health:'سلامت', idea:'ایده', life:'شخصی' };

                    return {
                        id: log.id,
                        type: log.type,
                        hasMedia: log.hasMedia,
                        html: `
                        <div id="log-${log.id}" class="glass-card rounded-[2rem] p-6 group animate-slide-up">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${colorMap[log.type]} flex items-center justify-center text-white shadow-lg shrink-0 ring-1 ring-white/20">
                                        <i class="ph-fill ${iconMap[log.type]} text-2xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-lg text-white leading-tight mb-1.5">${log.title}</h3>
                                        <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                            <span class="bg-slate-900/60 px-2.5 py-1 rounded-lg border border-white/5">${catMap[log.category] || log.category}</span>
                                            <span class="opacity-60 font-mono">${log.date}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="app.deleteLog('${log.id}')" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition">
                                    <i class="ph-bold ph-trash text-xl"></i>
                                </button>
                            </div>
                            ${log.desc ? `<p class="mt-4 text-sm text-slate-300 leading-7 bg-slate-900/30 p-4 rounded-2xl border border-white/5">${log.desc}</p>` : ''}
                            ${(log.hasMedia) ? `<div class="mt-6">${mediaHtml}</div>` : ''}
                        </div>`
                    };
                }));

                container.innerHTML = items.map(i => i.html).join('');
                items.forEach(item => { if(item.type === 'video' && item.hasMedia) this.attachVideoLogic(item.id); });
            },

            async deleteLog(id) {
                if(!confirm('حذف شود؟')) return;
                const el = document.getElementById(`log-${id}`);
                if(el) {
                    el.style.transform = 'scale(0.9) translateX(50px)';
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }
                const logs = JSON.parse(localStorage.getItem('taskLogs') || '[]');
                localStorage.setItem('taskLogs', JSON.stringify(logs.filter(l => l.id !== id)));
                await db.deleteFile(id);
                this.showToast('حذف شد');
            },

            // --- Audio Logic (FIXED RTL) ---
            getAudioHTML(url, id, isReview = false) {
                // If in review mode, we need a unique ID for the player to prevent conflict with global player
                const playerId = isReview ? `review-audio-${id}` : id;
                const playerFunction = isReview ? `app.playReviewAudio('${playerId}')` : `app.playGlobalAudio('${url}', '${playerId}')`;
                const audioTag = isReview ? `<audio id="${playerId}" src="${url}"></audio>` : '';
                
                return `
                <div class="w-full bg-slate-950/40 backdrop-blur-md rounded-3xl p-4 flex items-center gap-4 border border-white/10 shadow-inner">
                    ${audioTag}
                    <button id="play-btn-${playerId}" class="w-12 h-12 rounded-full bg-primary hover:bg-primary/90 flex items-center justify-center shrink-0 transition text-white shadow-lg shadow-primary/20" onclick="${playerFunction}">
                        <i class="ph-fill ph-play text-xl ml-0.5"></i>
                    </button>
                    <div class="flex-1 flex flex-col justify-center gap-1.5 pt-1">
                        <div class="relative w-full h-4 flex items-center">
                            <input type="range" id="seek-${playerId}" class="audio-range" value="0" min="0" max="100" step="0.1"
                                oninput="app.onAudioSeekInput('${playerId}')" 
                                onchange="app.onAudioSeekChange('${playerId}')">
                        </div>
                        <div class="flex justify-between w-full px-1">
                             <span id="time-curr-${playerId}" class="text-[10px] text-slate-400 font-mono tracking-widest">00:00</span>
                             <span id="time-dur-${playerId}" class="text-[10px] text-slate-500 font-mono tracking-widest">--:--</span>
                        </div>
                    </div>
                </div>`;
            },
            
            // Audio Player Core (For activity logs)
            playGlobalAudio(url, id) {
                const p = document.getElementById('globalAudioPlayer');
                
                if (this.activeAudioId === id && p.src) {
                    if (p.paused) p.play(); else p.pause();
                    return;
                }

                this.resetGlobalAudioUI();
                this.activeAudioId = id;
                p.src = url;
                p.load();
                p.play();

                this.setupAudioListeners(p, id);
            },
            
            // Audio Player Core (For review before submission)
            playReviewAudio(id) {
                const p = document.getElementById(id);
                if (!p) return;
                
                // Pause global player if active
                if (!document.getElementById('globalAudioPlayer').paused) {
                    document.getElementById('globalAudioPlayer').pause();
                }

                if (p.paused) {
                    p.play();
                    this.updateAudioBtn(id, true);
                } else {
                    p.pause();
                    this.updateAudioBtn(id, false);
                }

                p.onended = () => {
                    this.updateAudioBtn(id, false);
                    p.currentTime = 0;
                    this.updateAudioProgress(id, 0, p.duration);
                };

                this.setupAudioListeners(p, id, true);
            },
            
            setupAudioListeners(p, id, isReview = false) {
                const seekEl = document.getElementById(`seek-${id}`);
                const durEl = document.getElementById(`time-dur-${id}`);
                
                p.onloadedmetadata = () => {
                    const d = p.duration;
                    if(durEl) durEl.textContent = this.fmtTime(d);
                    if(seekEl) seekEl.max = d;
                    // Initial update for review player duration
                    if(isReview) this.updateAudioProgress(id, p.currentTime, p.duration);
                };

                p.ontimeupdate = () => {
                    if (!this.audioIsDragging) {
                        this.updateAudioProgress(id, p.currentTime, p.duration);
                    }
                };
            },

            // Updates the visual elements (time, slider value, and CSS fill)
            updateAudioProgress(id, currentTime, duration) {
                const seekEl = document.getElementById(`seek-${id}`);
                const currEl = document.getElementById(`time-curr-${id}`);
                
                if (!seekEl || !currEl || isNaN(duration)) return;

                seekEl.value = currentTime;
                currEl.textContent = this.fmtTime(currentTime);
                
                // Calculate percentage from 0 to 100
                const pct = (currentTime / duration) * 100;
                
                // Progress is set via CSS variable, filling from the right.
                // Since the native range input is now RTL, both knob and fill move R->L.
                seekEl.style.setProperty('--progress', `${pct}%`);
            },

            // Audio Handlers (The Fix)
            onAudioSeekInput(id) {
                this.audioIsDragging = true;
                const seekEl = document.getElementById(`seek-${id}`);
                const p = document.getElementById(id) || document.getElementById('globalAudioPlayer');
                
                if (!p || isNaN(p.duration)) return;
                
                // Visual update only
                this.updateAudioProgress(id, parseFloat(seekEl.value), p.duration);
            },

            onAudioSeekChange(id) {
                const p = document.getElementById(id) || document.getElementById('globalAudioPlayer');
                const seekEl = document.getElementById(`seek-${id}`);
                
                if (p.src || p.id === id) { // Check if it's the active global player or the review player
                    p.currentTime = seekEl.value;
                }
                this.audioIsDragging = false;
            },

            updateAudioBtn(id, isPlaying) {
                if(!id) return;
                const btn = document.getElementById(`play-btn-${id}`);
                if(btn) btn.innerHTML = isPlaying ? '<i class="ph-fill ph-pause text-xl"></i>' : '<i class="ph-fill ph-play text-xl ml-0.5"></i>';
            },

            resetGlobalAudioUI() {
                this.audioIsDragging = false;
                this.activeAudioId = null;
                document.querySelectorAll('[id^="play-btn-"]').forEach(b => b.innerHTML = '<i class="ph-fill ph-play text-xl ml-0.5"></i>');
                document.querySelectorAll('.audio-range').forEach(r => { 
                    r.value = 0; 
                    r.style.setProperty('--progress', '0%');
                });
            },

            // --- Video Logic (Corrected Knob + No Loop) ---
            getVideoHTML(url, id) {
                const uid = `vplayer-${id}`;
                return `
                <div class="flex justify-center py-2 pb-8">
                    <div id="wrapper-${uid}" class="circular-player-wrapper initial group">
                        <div class="video-mask">
                            <video id="${uid}" src="${url}" class="circular-video" playsinline muted></video>
                        </div>
                        <svg class="progress-ring-svg" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="48" class="progress-ring-bg" />
                            <circle id="ring-${uid}" cx="50" cy="50" r="48" class="progress-ring-fill" />
                        </svg>
                        <div id="knob-${uid}" class="control-knob"></div>
                        <div id="touch-${uid}" class="interaction-layer"></div>
                        <div id="overlay-${uid}" class="play-overlay"><i class="ph-fill ph-play text-white text-4xl drop-shadow-xl"></i></div>
                    </div>
                </div>`;
            },

            attachVideoLogic(id) {
                const uid = `vplayer-${id}`;
                const vid = document.getElementById(uid);
                const wrapper = document.getElementById(`wrapper-${uid}`);
                const ring = document.getElementById(`ring-${uid}`);
                const knob = document.getElementById(`knob-${uid}`);
                const touchLayer = document.getElementById(`touch-${uid}`);
                
                if (!vid) return;

                const r = 48, c = 2 * Math.PI * r;
                ring.style.strokeDasharray = `${c} ${c}`;
                ring.style.strokeDashoffset = c;

                let isDragging = false;

                const updateUI = (pct) => {
                    const offset = c - (pct * c);
                    ring.style.strokeDashoffset = offset;
                    
                    // Correct Math: Center (50) + Radius (48) * Cos/Sin
                    // -90deg rotation is handled in CSS, so 0rad is top.
                    const angleRad = (pct * 360 - 90) * (Math.PI / 180);
                    const kx = 50 + 48 * Math.cos(angleRad);
                    const ky = 50 + 48 * Math.sin(angleRad);
                    
                    knob.style.left = `${kx}%`;
                    knob.style.top = `${ky}%`;
                };

                vid.ontimeupdate = () => { 
                    if(vid.duration && !isDragging) updateUI(vid.currentTime / vid.duration);
                };

                // Play/Pause
                touchLayer.onclick = (e) => {
                    if (isDragging) return; 
                    e.stopPropagation();
                    
                    // Pause others
                    document.querySelectorAll('.circular-player-wrapper.active').forEach(w => {
                        if(w !== wrapper) { 
                            w.classList.remove('active','playing'); 
                            w.querySelector('video')?.pause(); 
                        }
                    });
                    
                    if (vid.paused) {
                        wrapper.classList.add('active', 'playing');
                        vid.play(); vid.muted = false;
                    } else {
                        wrapper.classList.remove('playing');
                        vid.pause(); vid.muted = true;
                    }
                };

                vid.onended = () => {
                    wrapper.classList.remove('playing');
                    vid.currentTime = 0;
                    updateUI(0);
                };
                
                // Drag Logic
                const handleDrag = (e) => {
                    e.preventDefault();
                    if(!wrapper.classList.contains('active')) return;
                    isDragging = true; 

                    const rect = wrapper.getBoundingClientRect();
                    const cx = rect.left + rect.width/2;
                    const cy = rect.top + rect.height/2;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    let angle = Math.atan2(clientY - cy, clientX - cx) * (180/Math.PI) + 90;
                    if(angle < 0) angle += 360;
                    
                    const pct = Math.min(Math.max(angle / 360, 0.001), 0.999);
                    
                    updateUI(pct);
                    if(vid.duration) vid.currentTime = pct * vid.duration;
                };

                const endDrag = () => {
                    setTimeout(() => { isDragging = false; }, 50);
                    document.body.style.overflow = '';
                    window.removeEventListener('mousemove', handleDrag);
                    window.removeEventListener('touchmove', handleDrag);
                };
                
                touchLayer.onmousedown = (e) => {
                    if(!wrapper.classList.contains('active')) return;
                    window.addEventListener('mousemove', handleDrag);
                    window.addEventListener('mouseup', endDrag, {once:true});
                };
                touchLayer.ontouchstart = (e) => {
                    if(!wrapper.classList.contains('active')) return;
                    document.body.style.overflow = 'hidden';
                    window.addEventListener('touchmove', handleDrag, {passive:false});
                    window.addEventListener('touchend', endDrag, {once:true});
                };
            },

            // --- Recording Utils ---
            async startAudio() {
                const stream = await this.getStream('audio');
                if(!stream) return;
                this.setupRecorder(stream, 'audio', 'audio/webm');
                
                const ac = new (window.AudioContext||window.webkitAudioContext)();
                const src = ac.createMediaStreamSource(stream);
                const an = ac.createAnalyser(); an.fftSize = 64; 
                src.connect(an);
                const data = new Uint8Array(an.frequencyBinCount);
                const ctx = document.getElementById('audioVisualizer').getContext('2d');
                
                const draw = () => {
                    this.visualizerFrame = requestAnimationFrame(draw);
                    an.getByteFrequencyData(data);
                    ctx.clearRect(0,0,300,80);
                    const w = (300/data.length)*2; let x=0;
                    for(let i=0; i<data.length; i++) {
                        const h = (data[i]/255)*80;
                        ctx.fillStyle = `rgba(244, 63, 94, ${data[i]/255 + 0.2})`;
                        ctx.fillRect(x, (80-h)/2, w-2, h); // Centered bars
                        x+=w;
                    }
                };
                draw();
            },

            async startVideo() {
                const stream = await this.getStream('video');
                if(!stream) return;
                document.getElementById('videoPreview').srcObject = stream;
                this.setupRecorder(stream, 'video', 'video/webm;codecs=vp9');
            },

            setupRecorder(stream, type, mimeType) {
                this.currentStream = stream;
                this.chunks = [];
                if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = type==='video' ? 'video/webm' : 'audio/webm';
                
                this.mediaRecorder = new MediaRecorder(stream, { mimeType });
                this.mediaRecorder.ondataavailable = e => { if(e.data.size>0) this.chunks.push(e.data); };
                this.mediaRecorder.onstop = () => {
                    this.currentBlob = new Blob(this.chunks, { type: this.mediaRecorder.mimeType });
                    this.stopStream();
                    this.stopTimer(); // Stop timer when recording stops
                    if(type === 'audio') this.showAudioReview(this.currentBlob);
                    else this.showVideoReview(this.currentBlob);
                };
                this.mediaRecorder.start();
                this.startTimer(type === 'audio' ? 'audioTimer' : 'videoTimer');
                
                document.getElementById(`btnRecord${type.charAt(0).toUpperCase()+type.slice(1)}`).classList.add('hidden');
                document.getElementById(`btnStop${type.charAt(0).toUpperCase()+type.slice(1)}`).classList.remove('hidden');
            },

            stopAudio() { if(this.mediaRecorder?.state === 'recording') this.mediaRecorder.stop(); },
            stopVideo() { if(this.mediaRecorder?.state === 'recording') this.mediaRecorder.stop(); },

            // Show Audio Review (Updated to include player)
            showAudioReview(blob) {
                if(this.visualizerFrame) cancelAnimationFrame(this.visualizerFrame);
                document.getElementById('audioRecorderState').classList.add('hidden');
                document.getElementById('audioReviewState').classList.remove('hidden');
                
                const url = URL.createObjectURL(blob);
                const reviewId = 'review';
                document.getElementById('audioReviewPlayer').innerHTML = this.getAudioHTML(url, reviewId, true);
                
                // Initial duration setup for review player
                const p = document.getElementById(reviewId);
                p.onloadedmetadata = () => {
                    document.getElementById(`time-dur-${reviewId}`).textContent = this.fmtTime(p.duration);
                    document.getElementById(`seek-${reviewId}`).max = p.duration;
                    this.updateAudioProgress(reviewId, 0, p.duration);
                };
            },

            showVideoReview(blob) {
                document.getElementById('videoPreview').classList.add('hidden');
                const vid = document.getElementById('videoReview');
                vid.classList.remove('hidden');
                vid.src = URL.createObjectURL(blob);
                
                document.getElementById('videoTimerOverlay').classList.add('hidden');
                document.getElementById('videoReviewActions').classList.remove('hidden');
                document.getElementById('btnStopVideo').classList.add('hidden');
                
                const btn = document.getElementById('btnPlayVideoPreview');
                btn.onclick = () => { vid.paused ? (vid.play(), btn.innerHTML='<i class="ph-fill ph-pause text-3xl"></i>') : (vid.pause(), btn.innerHTML='<i class="ph-fill ph-play text-3xl ml-1"></i>'); };
                vid.onended = () => btn.innerHTML='<i class="ph-fill ph-play text-3xl ml-1"></i>';
            },

            resetAudioUI() {
                document.getElementById('audioReviewState').classList.add('hidden');
                document.getElementById('audioRecorderState').classList.remove('hidden');
                document.getElementById('btnRecordAudio').classList.remove('hidden');
                document.getElementById('btnStopAudio').classList.add('hidden');
                document.getElementById('audioTimer').textContent = '00:00';
                document.getElementById('audioReviewPlayer').innerHTML = '';
            },
            resetVideoUI() {
                document.getElementById('videoPreview').classList.remove('hidden');
                document.getElementById('videoReview').classList.add('hidden');
                document.getElementById('videoTimerOverlay').classList.remove('hidden');
                document.getElementById('videoReviewActions').classList.add('hidden');
                document.getElementById('btnRecordVideo').classList.remove('hidden');
                document.getElementById('btnStopVideo').classList.add('hidden');
                document.getElementById('videoTimer').textContent = '00:00';
            },
            resetAudio() { this.resetAudioUI(); this.currentBlob = null; },
            resetVideo() { this.resetVideoUI(); this.currentBlob = null; },
            
            showToast(msg, type='success') {
                const t = document.getElementById('toast');
                t.querySelector('span').textContent = msg;
                t.querySelector('i').className = type==='success' ? 'ph-bold ph-check-circle text-2xl text-emerald-400' : 'ph-bold ph-warning-circle text-2xl text-rose-400';
                t.className = `fixed top-8 left-1/2 transform -translate-x-1/2 z-[100] flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 border backdrop-blur-xl ${type==='success'?'bg-slate-900/95 border-emerald-500/30 text-white shadow-emerald-500/10':'bg-slate-900/95 border-rose-500/30 text-white shadow-rose-500/10'}`;
                t.classList.remove('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => t.classList.add('opacity-0', 'translate-y-[-20px]'), 3000);
            },

            async exportData() {
                try {
                    const zip = new JSZip();
                    const logs = JSON.parse(localStorage.getItem('taskLogs') || '[]');
                    zip.file("data.json", JSON.stringify(logs));
                    const folder = zip.folder("media");
                    await Promise.all(logs.filter(l=>l.hasMedia).map(async l => {
                        const b = await db.getFile(l.id);
                        if(b) folder.file(`${l.id}.${b.type.includes('video')?'webm':'webm'}`, b);
                    }));
                    const c = await zip.generateAsync({type:"blob"});
                    const a = document.createElement('a'); a.href = URL.createObjectURL(c); a.download = 'TaskChrono_Backup.zip'; a.click();
                    this.showToast('پشتیبان‌گیری انجام شد');
                } catch { this.showToast('خطا در پشتیبان‌گیری', 'error'); }
            },
            async handleImport(e) {
                const f = e.target.files[0]; if(!f) return;
                try {
                    const zip = await new JSZip().loadAsync(f);
                    const dataFile = zip.file("data.json");
                    if (!dataFile) {
                        this.showToast('فایل پشتیبان معتبر نیست', 'error');
                        return;
                    }
                    const data = JSON.parse(await dataFile.async("string"));
                    localStorage.setItem('taskLogs', JSON.stringify(data));
                    const media = zip.folder("media");
                    const promises = [];
                    media.forEach((path, file) => promises.push(file.async("blob").then(b => db.saveFile(path.split('.')[0], b))));
                    await Promise.all(promises);
                    this.renderLogs();
                    this.showToast('بازیابی با موفقیت انجام شد');
                } catch(e) { 
                    console.error("Import Error:", e);
                    this.showToast('خطا در بازیابی فایل', 'error'); 
                } finally {
                     e.target.value = ''; 
                }
            },
            fmtTime(s) {
                if(!s || isNaN(s)) return '00:00';
                const m = Math.floor(s/60);
                const sec = Math.floor(s%60);
                return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnRecordAudio').addEventListener('click', () => app.startAudio());
            document.getElementById('btnStopAudio').addEventListener('click', () => app.stopAudio());
            document.getElementById('btnRecordVideo').addEventListener('click', () => app.startVideo());
            document.getElementById('btnStopVideo').addEventListener('click', () => app.stopVideo());
            app.init();
        });
    </script>
</body>
</html>
